name: Deploy a GitHub Pages

# Despliega la rama de trabajo a GitHub Pages (§4 Fase 0: "preview por rama").
# Requiere: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/handwritten-notes-ipad-mypd22
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue en curso; no cancela el que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Sitio de proyecto: https://<usuario>.github.io/Notulae/
          # Debe coincidir EXACTAMENTE con el nombre del repo (mayúscula incluida).
          BASE_PATH: /Notulae/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
